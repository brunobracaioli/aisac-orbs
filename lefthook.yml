min_version: 1.5.0

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --config .gitleaks.toml
    eslint:
      glob: "**/*.{js,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
    prettier:
      glob: "**/*.{js,mjs,cjs,json,md,yml,yaml,ts,tsx,css}"
      run: pnpm exec prettier --write {staged_files}
