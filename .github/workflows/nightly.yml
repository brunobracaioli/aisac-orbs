name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  perf-and-audit:
    name: nightly-perf-and-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with: { version: 10.18.2 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.22.2, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: Perf probe placeholder until Wave 2
        shell: bash
        run: |
          if [[ -f engine/render/ParticleSystem.impl.ts ]]; then
            pnpm exec playwright install --with-deps chromium
            pnpm exec playwright test --project=perf
          else
            echo "PERF PROBE SKIPPED: engine/render/ParticleSystem.impl.ts is not present until Wave 2." >> "$GITHUB_STEP_SUMMARY"
          fi
