name: stage-09-sast-codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sast-codeql:
    name: stage-09-sast-codeql
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@3e6af16ff035267728e2ebc35df5d4c4cf249f81 # v3.30.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@192325c86100d080feab897ff886c34abd4c83a3 # v3.30.3
        with:
          category: /language:javascript-typescript
          upload: true
      # Repository administrators must enable code-scanning protection and
      # require this check to block high-severity alerts. A successful analyze
      # action alone is not evidence that the high-alert policy is active.
