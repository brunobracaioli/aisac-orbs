name: weekly

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: true

jobs:
  history-secrets-and-browsers:
    name: weekly-history-secrets-and-browsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Install pinned Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.2
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" --output "/tmp/${archive}"
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$RUNNER_TEMP/gitleaks"
      - run: |
          "$RUNNER_TEMP/gitleaks" detect --redact --no-banner --config .gitleaks.toml --source .
      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with: { version: 10.18.2 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22.22.2, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Cross-browser smoke placeholder until browser projects exist
        shell: bash
        run: |
          if rg -q 'name: (webkit|firefox)' playwright.config.ts; then
            pnpm exec playwright install --with-deps chromium webkit firefox
            pnpm exec playwright test --project=webkit --project=firefox
          else
            echo "CROSS-BROWSER SMOKE SKIPPED: WebKit and Firefox projects are introduced after Wave 0." >> "$GITHUB_STEP_SUMMARY"
          fi
