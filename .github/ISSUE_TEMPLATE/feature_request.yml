name: Feature request
description: Propose a user-visible capability.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Existing requirement ID
      description: List the current ID, or explain why a new one is needed.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe deterministic tests and observable outcomes.
    validations:
      required: true
